version: "3.9"

services:
  # Local dev database only. For a $0/free-tier deployment, point
  # DB_HOST/DB_NAME/DB_USER/DB_PASSWORD/DB_PORT (.eee) at a hosted
  # Postgres with the pgvector extension instead - Neon.tech and
  # Supabase both offer a free tier that supports
  # `CREATE EXTENSION vector`. The app itself (`manage.py runserver`)
  # still runs natively on the host, same as before - this file
  # provisions the backing database only, no Dockerfile for the Django
  # app exists in this project.
  postgres:
    image: pgvector/pgvector:pg17
    container_name: pgvector-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rag_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

{% extends "emails/_base_email.html" %}

{% block content %}
  <p style="margin:0 0 12px; font-size:16px; font-weight:600; color:#1f1b16;">{{ title }}</p>
  <p style="margin:0 0 20px; font-size:14px; line-height:1.6; color:#3a352d;">{{ message }}</p>
  {% if action_url %}
    <a href="{{ action_url }}" style="display:inline-block; background-color:#7a1f2b; color:#ffffff; text-decoration:none; font-size:14px; font-weight:600; padding:10px 20px; border-radius:8px;">Open</a>
  {% endif %}
{% endblock %}

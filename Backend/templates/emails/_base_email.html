<!-- Shared email layout. Inline/minimal CSS only - most email clients
     strip script tags and external stylesheets, so this deliberately
     does not pull in Tailwind like the rest of the app's templates.
     Individual emails extend this and fill the content block below. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ site_name }}{% endblock %}</title>
</head>
<body style="margin:0; padding:0; background-color:#f5f4f2; font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; color:#1f1b16;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f5f4f2; padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" style="max-width:480px; background-color:#ffffff; border-radius:12px; border:1px solid #e8e4dd; overflow:hidden;">
          <tr>
            <td style="background-color:#7a1f2b; padding:20px 28px;">
              <span style="color:#ffffff; font-size:16px; font-weight:600;">{{ site_name }}</span>
            </td>
          </tr>
          <tr>
            <td style="padding:28px;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:16px 28px; border-top:1px solid #e8e4dd;">
              <p style="margin:0; font-size:12px; color:#8a8378;">
                This is an automated message from {{ site_name }}. If you didn't expect this email, you can safely ignore it.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>

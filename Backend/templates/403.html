{% extends "base.html" %}

{% block title %}Access Denied{% endblock %}

{% block content %}
<div class="mx-auto flex max-w-md flex-col items-center py-16 text-center">
  <div class="mb-4 flex h-14 w-14 items-center justify-center rounded-full bg-danger/10 text-danger dark:text-danger-dark">
    <i data-lucide="shield-alert" class="h-7 w-7"></i>
  </div>
  <h1 class="text-xl font-bold text-ink dark:text-ink-dark">Access Denied</h1>
  <p class="mt-2 text-sm text-muted dark:text-muted-dark">
    You don't have permission to view this page. If you believe this is a mistake, contact your workspace administrator.
  </p>
  <a href="{% url 'home' %}" class="mt-6 inline-flex items-center gap-2 rounded-lg bg-primary px-4 py-2.5 text-sm font-semibold text-white transition-colors hover:bg-primary-dark">
    <i data-lucide="arrow-left" class="h-4 w-4"></i> Back to my dashboard
  </a>
</div>
{% endblock %}

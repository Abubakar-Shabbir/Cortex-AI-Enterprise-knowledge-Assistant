{% extends "auth_base.html" %}

{% block title %}Password updated{% endblock %}

{% block auth_content %}

<div class="auth-success-icon auth-pop-in mb-2 flex h-11 w-11 items-center justify-center rounded-xl bg-success/10 text-success dark:text-success-dark">
  <i data-lucide="check-circle" class="h-5 w-5"></i>
</div>

<h1 class="text-xl font-bold tracking-tight text-ink dark:text-ink-dark">Password updated</h1>
<p class="mt-1 text-sm text-muted dark:text-muted-dark">Your password has been changed. You can now log in with your new password.</p>

<a href="{% url 'login' %}" class="mt-6 flex items-center justify-center gap-2 rounded-lg bg-primary py-2.5 text-center text-sm font-semibold text-white shadow-softer transition-all duration-150 hover:bg-primary-dark hover:shadow-glow active:scale-[0.98]">
  Log in
</a>

{% endblock %}

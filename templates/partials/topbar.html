<header class="sticky top-0 z-20 flex h-16 shrink-0 items-center gap-3 border-b border-line bg-card/90 px-4 backdrop-blur dark:border-line-dark dark:bg-card-dark/90 sm:px-6 lg:px-8">

  <button @click="sidebarOpen = true" class="rounded-lg p-2 text-muted hover:bg-surface dark:text-muted-dark dark:hover:bg-white/5 lg:hidden">
    <i data-lucide="menu" class="h-5 w-5"></i>
  </button>

  <a href="{% url 'home' %}" class="flex items-center gap-2 text-primary dark:text-primary-soft lg:hidden">
    {% include "partials/_logo.html" with size="h-7 w-7" %}
  </a>

  <form action="{% url 'documents' %}" method="GET" class="relative hidden max-w-sm flex-1 sm:block">
    <i data-lucide="search" class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-muted dark:text-muted-dark"></i>
    <input
      type="text"
      name="q"
      placeholder="Search documents…"
      class="w-full rounded-lg border border-line bg-surface py-2 pl-9 pr-16 text-sm text-ink placeholder:text-muted focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/15 dark:border-line-dark dark:bg-white/5 dark:text-ink-dark dark:placeholder:text-muted-dark"
    >
    <button
      type="button"
      @click="$dispatch('open-command-palette')"
      title="Command palette"
      class="absolute right-1.5 top-1/2 hidden -translate-y-1/2 items-center gap-1 rounded-md border border-line px-1.5 py-0.5 text-[10px] font-medium text-muted hover:bg-line/60 dark:border-line-dark dark:text-muted-dark dark:hover:bg-white/10 sm:flex"
    >
      ⌘K
    </button>
  </form>

  <div class="flex-1 sm:hidden"></div>

  <div class="flex items-center gap-1.5 sm:gap-2">

    <button
      @click="$dispatch('open-command-palette')"
      class="rounded-lg p-2 text-muted hover:bg-surface dark:text-muted-dark dark:hover:bg-white/5 sm:hidden"
      aria-label="Command palette"
    >
      <i data-lucide="search" class="h-4 w-4"></i>
    </button>

    <button
      @click="document.documentElement.classList.toggle('dark'); localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light'"
      class="rounded-lg p-2 text-muted hover:bg-surface dark:text-muted-dark dark:hover:bg-white/5"
      aria-label="Toggle dark mode"
    >
      <i data-lucide="sun" class="hidden h-4 w-4 dark:block"></i>
      <i data-lucide="moon" class="block h-4 w-4 dark:hidden"></i>
    </button>

    <div class="relative" x-data="{ open: false }" @click.outside="open = false">
      <button @click="open = !open" class="relative rounded-lg p-2 text-muted hover:bg-surface dark:text-muted-dark dark:hover:bg-white/5" aria-label="Notifications">
        <i data-lucide="bell" class="h-4 w-4"></i>
        {% if activity_feed %}
          <span class="absolute right-1.5 top-1.5 h-1.5 w-1.5 rounded-full bg-primary"></span>
        {% endif %}
      </button>

      <div x-show="open" x-cloak x-transition class="absolute right-0 z-30 mt-2 w-80 rounded-xl border border-line bg-card p-2 shadow-soft dark:border-line-dark dark:bg-card-dark">
        <div class="px-2 py-1.5 text-xs font-semibold uppercase tracking-wide text-muted dark:text-muted-dark">Recent Activity</div>
        {% for event in activity_feed %}
          <div class="flex items-start gap-2.5 rounded-lg px-2 py-2 hover:bg-surface dark:hover:bg-white/5">
            <div class="mt-0.5 flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-primary-soft/50 text-primary dark:bg-primary/15 dark:text-primary-soft">
              <i data-lucide="{{ event.icon }}" class="h-3.5 w-3.5"></i>
            </div>
            <div class="min-w-0">
              <p class="truncate text-sm text-ink dark:text-ink-dark">{{ event.text }}</p>
              <p class="text-xs text-muted dark:text-muted-dark">{{ event.at|timesince }} ago</p>
            </div>
          </div>
        {% empty %}
          <p class="px-2 py-3 text-sm text-muted dark:text-muted-dark">You're all caught up.</p>
        {% endfor %}
      </div>
    </div>

    <div class="mx-1 h-6 w-px bg-line dark:bg-line-dark"></div>

    <div class="relative" x-data="{ open: false }" @click.outside="open = false">
      <button @click="open = !open" class="flex items-center gap-2.5 rounded-lg py-1.5 pl-1.5 pr-2 hover:bg-surface dark:hover:bg-white/5">
        <div class="flex h-8 w-8 items-center justify-center rounded-full bg-primary text-xs font-semibold text-white">
          {{ request.user.first_name|first|default:request.user.username|first|upper }}{{ request.user.last_name|first|upper }}
        </div>
        <div class="hidden text-left leading-tight sm:block">
          <div class="text-sm font-medium text-ink dark:text-ink-dark">{{ request.user.first_name|default:request.user.username }}</div>
          <div class="text-xs text-muted dark:text-muted-dark">{{ request.user.email|default:"—" }}</div>
        </div>
        <i data-lucide="chevron-down" class="hidden h-4 w-4 text-muted dark:text-muted-dark sm:block"></i>
      </button>

      <div x-show="open" x-cloak x-transition class="absolute right-0 z-30 mt-2 w-52 rounded-xl border border-line bg-card p-1.5 shadow-soft dark:border-line-dark dark:bg-card-dark">
        <a href="{% url 'profile' %}" class="flex items-center gap-2.5 rounded-lg px-3 py-2 text-sm text-ink hover:bg-surface dark:text-ink-dark dark:hover:bg-white/5">
          <i data-lucide="user-round" class="h-4 w-4 text-muted dark:text-muted-dark"></i> Profile
        </a>
        {% if request.user.is_staff %}
          <a href="{% url 'monitoring' %}" class="flex items-center gap-2.5 rounded-lg px-3 py-2 text-sm text-ink hover:bg-surface dark:text-ink-dark dark:hover:bg-white/5">
            <i data-lucide="activity" class="h-4 w-4 text-muted dark:text-muted-dark"></i> Monitoring
          </a>
        {% endif %}
        <div class="my-1 border-t border-line dark:border-line-dark"></div>
        <a href="{% url 'logout' %}" class="flex items-center gap-2.5 rounded-lg px-3 py-2 text-sm text-danger hover:bg-danger/10 dark:text-danger-dark">
          <i data-lucide="log-out" class="h-4 w-4"></i> Logout
        </a>
      </div>
    </div>

  </div>

</header>

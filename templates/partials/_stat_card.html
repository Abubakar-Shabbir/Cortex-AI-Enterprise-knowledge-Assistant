<div class="rounded-xl border border-line bg-card p-5 shadow-soft transition-transform dark:border-line-dark dark:bg-card-dark">
  <div class="flex items-center justify-between">
    <span class="text-xs font-medium text-muted dark:text-muted-dark">{{ label }}</span>
    <div class="flex h-8 w-8 items-center justify-center rounded-lg bg-primary-soft/50 text-primary dark:bg-primary/15 dark:text-primary-soft">
      <i data-lucide="{{ icon }}" class="h-4 w-4"></i>
    </div>
  </div>
  <div class="mt-3 text-2xl font-bold tracking-tight text-ink dark:text-ink-dark">{{ value }}</div>
  {% if sublabel %}
    <div class="mt-1 text-xs text-muted dark:text-muted-dark">{{ sublabel }}</div>
  {% endif %}
</div>

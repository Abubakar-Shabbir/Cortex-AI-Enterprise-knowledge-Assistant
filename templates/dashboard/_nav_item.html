{% comment %}
Dark-sidebar equivalent of partials/_nav_item.html - same active_nav
comparison, dark palette instead of light. Usage:
  {% include "dashboard/_nav_item.html" with url_name="documents" label="Documents" icon="file-text" %}
{% endcomment %}
<a
  href="{% url url_name %}"
  class="flex items-center gap-3 rounded-lg px-3 py-2.5 font-medium transition-all duration-150 ease-out
    {% if active_nav == url_name %}
      bg-gradient-to-r from-primary to-primary-light text-white shadow-[0_4px_14px_-2px_rgba(166,51,63,0.45)]
    {% else %}
      text-muted-dark hover:bg-primary/10 hover:text-white
    {% endif %}"
>
  <i data-lucide="{{ icon }}" class="h-4 w-4 shrink-0"></i> {{ label }}
</a>

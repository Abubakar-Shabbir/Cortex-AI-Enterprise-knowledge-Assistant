{% extends "auth_base.html" %}

{% block title %}Sign up{% endblock %}

{% block auth_content %}

<h1 class="text-xl font-bold tracking-tight text-ink dark:text-ink-dark">Create your account</h1>
<p class="mb-6 mt-1 text-sm text-muted dark:text-muted-dark">Fill in your details below to get started.</p>

<form method="POST" class="space-y-4" x-data="{ showPassword: false, showConfirm: false }">
  {% csrf_token %}

  {% if error %}
    <div class="flex items-start gap-2 rounded-lg border border-danger/20 bg-danger/10 px-3.5 py-3 text-sm text-danger dark:text-danger-dark">
      <i data-lucide="alert-circle" class="mt-0.5 h-4 w-4 shrink-0"></i>
      {{ error }}
    </div>
  {% endif %}

  <div>
    <label for="full_name" class="mb-1.5 block text-xs font-medium text-muted dark:text-muted-dark">Full name</label>
    <div class="relative">
      <i data-lucide="user-round" class="pointer-events-none absolute left-3.5 top-1/2 h-4 w-4 -translate-y-1/2 text-muted dark:text-muted-dark"></i>
      <input id="full_name" type="text" name="fullname" placeholder="Enter your full name" required autofocus
        class="w-full rounded-lg border border-line bg-surface py-2.5 pl-10 pr-3.5 text-sm text-ink placeholder:text-muted focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/15 dark:border-line-dark dark:bg-white/5 dark:text-ink-dark dark:placeholder:text-muted-dark">
    </div>
  </div>

  <div>
    <label for="email" class="mb-1.5 block text-xs font-medium text-muted dark:text-muted-dark">Email</label>
    <div class="relative">
      <i data-lucide="mail" class="pointer-events-none absolute left-3.5 top-1/2 h-4 w-4 -translate-y-1/2 text-muted dark:text-muted-dark"></i>
      <input id="email" type="email" name="email" placeholder="Enter your email" required
        class="w-full rounded-lg border border-line bg-surface py-2.5 pl-10 pr-3.5 text-sm text-ink placeholder:text-muted focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/15 dark:border-line-dark dark:bg-white/5 dark:text-ink-dark dark:placeholder:text-muted-dark">
    </div>
  </div>

  <div>
    <label for="username" class="mb-1.5 block text-xs font-medium text-muted dark:text-muted-dark">Username</label>
    <div class="relative">
      <i data-lucide="at-sign" class="pointer-events-none absolute left-3.5 top-1/2 h-4 w-4 -translate-y-1/2 text-muted dark:text-muted-dark"></i>
      <input id="username" type="text" name="username" placeholder="Choose a username" required
        class="w-full rounded-lg border border-line bg-surface py-2.5 pl-10 pr-3.5 text-sm text-ink placeholder:text-muted focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/15 dark:border-line-dark dark:bg-white/5 dark:text-ink-dark dark:placeholder:text-muted-dark">
    </div>
  </div>

  <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
    <div>
      <label for="password" class="mb-1.5 block text-xs font-medium text-muted dark:text-muted-dark">Password</label>
      <div class="relative">
        <i data-lucide="lock" class="pointer-events-none absolute left-3.5 top-1/2 h-4 w-4 -translate-y-1/2 text-muted dark:text-muted-dark"></i>
        <input :type="showPassword ? 'text' : 'password'" id="password" name="password" placeholder="Create a password" required
          class="w-full rounded-lg border border-line bg-surface py-2.5 pl-10 pr-9 text-sm text-ink placeholder:text-muted focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/15 dark:border-line-dark dark:bg-white/5 dark:text-ink-dark dark:placeholder:text-muted-dark">
        <button type="button" @click="showPassword = !showPassword" class="absolute right-3 top-1/2 -translate-y-1/2 text-muted hover:text-ink dark:text-muted-dark dark:hover:text-ink-dark" :aria-label="showPassword ? 'Hide password' : 'Show password'">
          <i data-lucide="eye" class="h-4 w-4" x-show="!showPassword"></i>
          <i data-lucide="eye-off" class="h-4 w-4" x-show="showPassword" x-cloak></i>
        </button>
      </div>
    </div>
    <div>
      <label for="confirm_password" class="mb-1.5 block text-xs font-medium text-muted dark:text-muted-dark">Confirm</label>
      <div class="relative">
        <i data-lucide="lock" class="pointer-events-none absolute left-3.5 top-1/2 h-4 w-4 -translate-y-1/2 text-muted dark:text-muted-dark"></i>
        <input :type="showConfirm ? 'text' : 'password'" id="confirm_password" name="confirm_password" placeholder="Re-enter password" required
          class="w-full rounded-lg border border-line bg-surface py-2.5 pl-10 pr-9 text-sm text-ink placeholder:text-muted focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/15 dark:border-line-dark dark:bg-white/5 dark:text-ink-dark dark:placeholder:text-muted-dark">
        <button type="button" @click="showConfirm = !showConfirm" class="absolute right-3 top-1/2 -translate-y-1/2 text-muted hover:text-ink dark:text-muted-dark dark:hover:text-ink-dark" :aria-label="showConfirm ? 'Hide password' : 'Show password'">
          <i data-lucide="eye" class="h-4 w-4" x-show="!showConfirm"></i>
          <i data-lucide="eye-off" class="h-4 w-4" x-show="showConfirm" x-cloak></i>
        </button>
      </div>
    </div>
  </div>

  <button type="submit" class="w-full rounded-lg bg-primary py-2.5 text-sm font-semibold text-white shadow-softer transition-colors hover:bg-primary-dark">
    Sign up
  </button>

  <p class="text-center text-sm text-muted dark:text-muted-dark">
    Already have an account? <a href="{% url 'login' %}" class="font-semibold text-primary hover:underline dark:text-primary-soft">Log in</a>
  </p>
</form>

{% endblock %}
